name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate packs
        run: python -m skillplay validate-packs
      - name: Run tests
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token: write is required for PyPI trusted publishing (OIDC) and for
    # generating build attestations. No PYPI_API_TOKEN secret is needed when
    # the project is configured as a trusted publisher on pypi.org.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      # Homebrew: publishing to a tap is repo-specific; the wheel on PyPI is the
      # source of truth. Add a homebrew tap formula in a separate repo pointing
      # at the PyPI release when you want `brew install skillplay`.

  # D: ship a single self-contained binary per tag, for each major OS.
  build-binary:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: skillplay-linux
          - os: macos-latest
            artifact: skillplay-macos
          - os: windows-latest
            artifact: skillplay-windows.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build single binary
        run: python scripts/build_binary.py --method pyinstaller
      - name: Rename binary per OS
        shell: bash
        run: |
          # PyInstaller always names the output `skillplay` (plus .exe on
          # Windows); disambiguate per-OS so release assets don't collide.
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/skillplay.exe dist/skillplay-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv dist/skillplay dist/skillplay-macos
          else
            mv dist/skillplay dist/skillplay-linux
          fi
      - name: Upload artifact (workflow archive)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/skillplay*
          if-no-files-found: error
      - name: Attach binary to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/skillplay*
          fail_on_unmatched_files: true
