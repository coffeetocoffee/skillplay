id: regex-negclass-01
skill: regex
title: Negated character class
topic: class
difficulty: 2
xp: 15
type: regex_build
prompt: |
  Write a pattern that matches one or more characters that are NOT digits.
context: {}
answer:
  value: "[^0-9]+"
validation:
  mode: regex_tester
  must_match: ["abc", "a1b"]
  must_not_match: ["123", ""]
hints:
  - "A `^` right after `[` negates the class."
explanation: |
  `[^0-9]+` matches runs of non-digit characters.
