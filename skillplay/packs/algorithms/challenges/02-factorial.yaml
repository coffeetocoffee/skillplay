id: alg-fact-01
title: Factorial
topic: math
difficulty: 2
xp: 20
type: fix_bug
prompt: |
  `factorial(n)` should return n! (factorial of n), but it always returns 1.
  Fix it so that factorial(5) == 120.

      def factorial(n):
          return 1   # BUG: never multiplies anything
answer:
  reference_code: |
    def factorial(n):
        r = 1
        for i in range(2, n + 1):
            r *= i
        return r
validation:
  mode: test_cases
  lang: python
  function: factorial
  test_cases:
    - args: [0]
      expected: 1
    - args: [1]
      expected: 1
    - args: [5]
      expected: 120
hints:
  - "Multiply 2 * 3 * ... * n into an accumulator that starts at 1."
explanation: |
  The product 1*2*...*n gives n! (with 0! and 1! both equal to 1).
