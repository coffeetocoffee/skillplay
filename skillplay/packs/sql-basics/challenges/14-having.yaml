id: sql-having-01
prerequisites: [sql-group-01]
skill: sql
title: Filter groups with HAVING
topic: aggregate
difficulty: 3
xp: 25
type: sql_query
prompt: |
  Return the names of authors who have written more than one book.
context:
  db_seed_sql: |
    CREATE TABLE authors(id INT, name TEXT);
    INSERT INTO authors VALUES (1, 'ana'), (2, 'bob');
    CREATE TABLE books(id INT, title TEXT, author_id INT);
    INSERT INTO books VALUES (1, 'T1', 1), (2, 'T2', 1), (3, 'T3', 2);
  schema_preview: "authors(id, name) | books(id, title, author_id)"
answer:
  reference_sql: "SELECT authors.name FROM books JOIN authors ON books.author_id = authors.id GROUP BY authors.name HAVING COUNT(*) > 1"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "HAVING filters groups, like WHERE but applied after aggregation."
explanation: |
  `HAVING COUNT(*) > 1` keeps only groups (authors) with more than one book.
translations:
  es:
    title: Filtra grupos con HAVING
    prompt: |
      Devuelve los nombres de los autores que han escrito más de un libro.
    hints:
      - "HAVING filtra grupos, como WHERE pero aplicado después de la agregación."
    explanation: |
      `HAVING COUNT(*) > 1` conserva solo los grupos (autores) con más de un libro.
