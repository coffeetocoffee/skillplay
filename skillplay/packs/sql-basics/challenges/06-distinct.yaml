id: sql-distinct-01
prerequisites: [sql-select-01]
skill: sql
title: Remove duplicates with DISTINCT
topic: distinct
difficulty: 2
xp: 15
type: sql_query
prompt: |
  Return the distinct shades from the `colors` table, with no duplicates.
context:
  db_seed_sql: |
    CREATE TABLE colors(shade TEXT);
    INSERT INTO colors VALUES ('red'), ('red'), ('blue'), ('green'), ('blue');
  schema_preview: "colors(shade TEXT)"
answer:
  reference_sql: "SELECT DISTINCT shade FROM colors"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "DISTINCT collapses duplicate rows in the result set."
explanation: |
  `SELECT DISTINCT` returns each unique value only once.
translations:
  es:
    title: Elimina duplicados con DISTINCT
    prompt: |
      Devuelve los tonos distintos de la tabla `colors`, sin duplicados.
    hints:
      - "DISTINCT colapsa las filas duplicadas del conjunto de resultados."
    explanation: |
      `SELECT DISTINCT` devuelve cada valor único una sola vez.
