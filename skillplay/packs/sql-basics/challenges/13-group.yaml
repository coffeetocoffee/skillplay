id: sql-group-01
prerequisites: [sql-join-01]
skill: sql
title: Aggregate per group with GROUP BY
topic: aggregate
difficulty: 3
xp: 25
type: sql_query
prompt: |
  For each author, count how many books they have written. Return the
  author name and the book count.
context:
  db_seed_sql: |
    CREATE TABLE authors(id INT, name TEXT);
    INSERT INTO authors VALUES (1, 'ana'), (2, 'bob');
    CREATE TABLE books(id INT, title TEXT, author_id INT);
    INSERT INTO books VALUES (1, 'T1', 1), (2, 'T2', 1), (3, 'T3', 2);
  schema_preview: "authors(id, name) | books(id, title, author_id)"
answer:
  reference_sql: "SELECT authors.name, COUNT(*) FROM books JOIN authors ON books.author_id = authors.id GROUP BY authors.name"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "GROUP BY author collapses rows; COUNT(*) counts each group."
explanation: |
  `GROUP BY authors.name` forms one group per author; COUNT(*) counts its books.
translations:
  es:
    title: Agrega por grupo con GROUP BY
    prompt: |
      Para cada autor, cuenta cuántos libros ha escrito. Devuelve el nombre
      del autor y el recuento de libros.
    hints:
      - "GROUP BY autor colapsa las filas; COUNT(*) cuenta cada grupo."
    explanation: |
      `GROUP BY authors.name` forma un grupo por autor; COUNT(*) cuenta sus libros.
