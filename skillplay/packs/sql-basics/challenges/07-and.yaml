id: sql-and-01
prerequisites: [sql-where-01]
skill: sql
title: Combine conditions with AND
topic: where
difficulty: 2
xp: 15
type: sql_query
prompt: |
  Return the names of users who are older than 30 AND live in 'paris'.
context:
  db_seed_sql: |
    CREATE TABLE users(name TEXT, age INT, city TEXT);
    INSERT INTO users VALUES ('ana', 25, 'london'), ('bob', 35, 'paris'), ('cid', 40, 'london'), ('dax', 22, 'paris');
  schema_preview: "users(name TEXT, age INT, city TEXT)"
answer:
  reference_sql: "SELECT name FROM users WHERE age > 30 AND city = 'paris'"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "Use AND to require both conditions to be true."
explanation: |
  `WHERE a AND b` keeps rows where both predicates hold.
translations:
  es:
    title: Combina condiciones con AND
    prompt: |
      Devuelve los nombres de los usuarios mayores de 30 años Y que viven en 'paris'.
    hints:
      - "Usa AND para exigir que ambas condiciones sean verdaderas."
    explanation: |
      `WHERE a AND b` conserva las filas donde ambos predicados se cumplen.
