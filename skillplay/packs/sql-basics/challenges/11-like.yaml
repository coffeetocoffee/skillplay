id: sql-like-01
prerequisites: [sql-where-01]
skill: sql
title: Pattern match with LIKE
topic: where
difficulty: 2
xp: 15
type: sql_query
prompt: |
  Return the names of users whose name starts with the letter 'a'. Use LIKE.
context:
  db_seed_sql: |
    CREATE TABLE users(name TEXT, age INT, city TEXT);
    INSERT INTO users VALUES ('ana', 25, 'london'), ('bob', 35, 'paris'), ('cid', 40, 'london'), ('dax', 22, 'paris');
  schema_preview: "users(name TEXT, age INT, city TEXT)"
answer:
  reference_sql: "SELECT name FROM users WHERE name LIKE 'a%'"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "'a%' means 'a' followed by any sequence of characters."
explanation: |
  `LIKE 'a%'` matches strings beginning with 'a'; `%` is a wildcard for any run of chars.
translations:
  es:
    title: Coincidencia de patrones con LIKE
    prompt: |
      Devuelve los nombres de los usuarios cuyo nombre empieza por la letra 'a'. Usa LIKE.
    hints:
      - "'a%' significa 'a' seguida de cualquier secuencia de caracteres."
    explanation: |
      `LIKE 'a%'` coincide con las cadenas que empiezan por 'a'; `%` es un comodín para cualquier tanda de caracteres.
