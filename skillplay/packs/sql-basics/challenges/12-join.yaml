id: sql-join-01
prerequisites: [sql-select-01]
skill: sql
title: Join two tables
topic: join
difficulty: 3
xp: 25
type: sql_query
prompt: |
  Return each book title together with its author's name by joining the
  `books` table to the `authors` table on author_id.
context:
  db_seed_sql: |
    CREATE TABLE authors(id INT, name TEXT);
    INSERT INTO authors VALUES (1, 'ana'), (2, 'bob');
    CREATE TABLE books(id INT, title TEXT, author_id INT);
    INSERT INTO books VALUES (1, 'T1', 1), (2, 'T2', 1), (3, 'T3', 2);
  schema_preview: "authors(id, name) | books(id, title, author_id)"
answer:
  reference_sql: "SELECT books.title, authors.name FROM books JOIN authors ON books.author_id = authors.id"
validation:
  mode: sql_result
  order_matters: false
  normalize: true
hints:
  - "JOIN ... ON links rows where the foreign key matches the primary key."
explanation: |
  An inner JOIN pairs each book with the author whose id equals author_id.
translations:
  es:
    title: Une dos tablas
    prompt: |
      Devuelve cada título de libro junto con el nombre de su autor, uniendo la
      tabla `books` con la tabla `authors` por author_id.
    hints:
      - "JOIN ... ON vincula filas donde la clave foránea coincide con la clave primaria."
    explanation: |
      Un JOIN interno empareja cada libro con el autor cuyo id es igual a author_id.
